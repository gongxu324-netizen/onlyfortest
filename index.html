const SEEN_KEY = "ppgen_seen_v1";
const SEEN_CAP = 800;
function loadSeen() {
  try {
    const raw = sessionStorage.getItem(SEEN_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) { return new Set(); }
}
function saveSeen(set) {
  try {

  } catch (e) {}

const pick = arr => arr[(Math.random() * arr.length) | 0];

function buildMainText(styleGroup, styleType, isAfter, isX) {
  const brandPool = isX ? DB.BRAND_X : DB.BRAND_IG;
  const brand = pick(brandPool);
  const mfw = pick(DB.MFW_VARIANTS);
  const name = DB.NAME;

  const starter = pick(styleGroup.starters);
  const verb = pick(styleGroup.verbs);
  const phrase = pick(styleGroup.phrases);
  const ending = pick(styleGroup.endings);
  const adverb = pick(DB.FORMAL.adverbs);
  const connector = pick(DB.CONNECTORS);
  let hypeVerb = verb, hypePhrase = phrase;
  if (!isAfter && styleType === 1 && Math.random() < 0.5) hypeVerb = pick(DB.HYPE_EXTRA.fangirl_verbs);
  if (!isAfter && styleType === 1 && Math.random() < 0.5) hypePhrase = pick(DB.HYPE_EXTRA.soft_phrases);
  const useConnector = Math.random() < 0.35;

  let sentence = "";
  let structChoice = Math.floor(Math.random() * 10);
  if (isAfter) structChoice = [0, 3, 5, 7][(Math.random() * 4) | 0];

  if (structChoice === 0) {
    sentence = `${starter} ${name} ${verb} ${brand} at ${mfw}, ${phrase} - ${ending}`;
  } else if (structChoice === 1) {
    sentence = `${name} in ${brand} at ${mfw}, ${phrase}. ${starter} ${ending}`;
  } else if (structChoice === 2) {
    sentence = `${brand} x ${name} at ${mfw} is a revelation, ${phrase}! ${ending}`;
  } else if (structChoice === 3) {
    sentence = `${starter} ${name} ${verb} ${brand} at ${mfw} - ${phrase}, ${ending}`;
  } else if (structChoice === 4) {
    sentence = `${name}, ${phrase}. ${starter} ${verb} ${brand} at ${mfw}, ${ending}`;
  } else if (structChoice === 5) {
    sentence = `${starter} ${name} at ${mfw} in ${brand}: ${phrase}. ${ending}`;
  } else if (structChoice === 6) {
    sentence = `${name} ${verb} ${brand}, ${phrase}. ${starter} ${ending}`;
  } else if (structChoice === 7) {
    sentence = `${starter} ${name} ${verb} ${brand} at ${mfw} ${adverb}, ${phrase}. ${ending}`;
  } else if (structChoice === 8) {
    sentence = `${name} ${hypeVerb} ${brand} at ${mfw}. ${starter} ${hypePhrase} - ${ending}`;
  } else {
    sentence = `${useConnector ? connector + " " : ""}${name} ${verb} ${brand} at ${mfw}, ${phrase}... ${ending}`;
  }

  if (!sentence.includes(DB.NAME)) sentence = `${DB.NAME}, ${sentence}`;
  if (!/gucci/i.test(sentence)) sentence = `${sentence} for Gucci`;
  return sentence;
}

// 按长度档位构造: tier0 (<=15词) / tier1 (16-25词) / tier2 (26-35词) / tier3 (>35词)
function buildTierText(tier, styleGroup, styleType, isAfter, isX) {
  const name = DB.NAME;
  const brand = pick(isX ? DB.BRAND_X : DB.BRAND_IG);
  const mfw = pick(DB.MFW_VARIANTS);

  if (tier === 0) {
    // 短句组装逻辑 (<=15个词)
    if (Math.random() < 0.75) {
      const B = DB.SHORT_BITS;
      const adj = pick(B.adjectives), noun = pick(B.nouns),
            v2 = pick(B.verbs2), obj = pick(B.objects), hv = pick(B.hypeBits);
      let forms;
      if (isAfter) {
        forms = [
          `${name} x ${brand}: what a journey.`,
          `${name} and ${brand} - history made.`,
          `${name} ${v2} ${obj} in ${brand}.`,
          `${name} x ${brand}: a new chapter begins.`
        ];
      } else if (styleType === 0) {
        forms = [
          `${name} x ${brand}: ${adj} ${noun}.`,
          `${name} ${v2} ${obj} in ${brand}.`,
          `${name}, ${adj} in ${brand}.`,
          `${brand} and ${name}: ${adj} ${noun}.`
        ];
      } else {
        forms = [
          `${name} ${hv} this ${brand} look.`,
          `${name} in ${brand}? ${adj} ${noun}.`,
          `${name} ${hv} ${obj}!`,
          `${name} and ${brand} - ${adj} ${noun}!`
        ];
      }
      let s = pick(forms);
      if (!s.includes(name)) s = `${name}, ${s}`;
      if (!/gucci/i.test(s)) s = `${s} - for GUCCI.`;
      return s;
    }
    let s = isAfter ? pick(DB.SHORT_AFTER) : pick(styleType === 0 ? DB.SHORT_FORMAL : DB.SHORT_HYPE);
    if (!s.includes(DB.NAME)) s = `${DB.NAME}, ${s}`;
    if (!/gucci/i.test(s)) s = `${s} - for GUCCI.`;
    return s;
  }

  if (tier === 1) {
    // 16-25词: 精简结构
    const t = (Math.random() * 3) | 0;
    let s;
    if (t === 0) s = `${pick(styleGroup.starters)} ${name} ${pick(styleGroup.verbs)} ${brand} at ${mfw} - ${pick(styleGroup.endings)}`;
    else if (t === 1) s = `${name} ${pick(styleGroup.verbs)} ${brand} at ${mfw}, ${pick(styleGroup.phrases)}.`;
    else s = `${pick(styleGroup.starters)} ${name} in ${brand} at ${mfw}: ${pick(styleGroup.phrases)}.`;
    return s;
  }

  if (tier === 3) {
    // >35词: 完整扩展结构
    let s = buildMainText(styleGroup, styleType, isAfter, isX);
    if (wordCount(s) < 36) s = `${s} ${pick(styleGroup.starters)} ${pick(styleGroup.phrases)}.`;
    return s;
  }

  return buildMainText(styleGroup, styleType, isAfter, isX);
}

function wordCount(text) {
  return text.split(/\s+/).filter(Boolean).length;
}

  let styleGroup, styleName;
  if (isAfter) {
    styleGroup = DB.AFTER; styleName = styleType === 0 ? "Elegant" : "Hype";
  } else if (styleType === 0) {
    styleGroup = DB.FORMAL; styleName = "Elegant";
  } else {
    styleGroup = DB.HYPE; styleName = "Hype";
  }

  // 核心优化比例：
  // Tier 0 (<=15词): 55%
  // Tier 1 (16-25词): 30% (此时 <=25词 达到 85%, 满足至少80%的目标)
  // Tier 2 (26-35词): 10%
  // Tier 3 (>35词): 5%
  const r = Math.random();
  let tier = isX
    ? (r < 0.55 ? 0 : r < 0.85 ? 1 : 2)
    : (r < 0.55 ? 0 : r < 0.85 ? 1 : r < 0.95 ? 2 : 3);
  
  const ranges = [[1, 15], [16, 25], [26, 35], [36, 999]];

  let sentence = buildTierText(tier, styleGroup, styleType, isAfter, isX);
  let guard = 0;
  while (guard++ < 50) {
    const w = wordCount(sentence);
    const fit = tier === 3 ? w >= 36 : (w >= ranges[tier][0] && w <= ranges[tier][1]);
    if (fit) break;
    sentence = buildTierText(tier, styleGroup, styleType, isAfter, isX);
    if (guard >= 50 && tier > 0) { // 兜底降级
      tier--;
      guard = 0;
    }
  }

  if (isX) {
    let fullX = sentence + "\n\n" + X_TAGS;
    if (fullX.length > X_LIMIT) {
      let s = isAfter ? pick(DB.SHORT_AFTER) : pick(styleType === 0 ? DB.SHORT_FORMAL : DB.SHORT_HYPE);
      if (!/gucci/i.test(s)) s = `${s} - for GUCCI.`;
      fullX = s + "\n\n" + X_TAGS;
      if (fullX.length > X_LIMIT) fullX = `PP Krit x ${pick(DB.BRAND_X)}!\n\n${X_TAGS}`;
      sentence = fullX;
    } else {
      sentence = fullX;
    }
  }

  return { text: sentence, styleName: styleName };
}

function getBatch() {
  const isX = currentMode.endsWith("-x");
  const isAfter = currentMode.indexOf("after") === 0;
  const results = [];
  const seen = new Set();
  let globalSeen = loadSeen();
  let styleIndex = 0;
  let misses = 0;
  let flushed = false;

  while (results.length < PAGE_SIZE) {
    const currentStyle = styleIndex % 2;
    const item = buildGrammarText(isX, currentStyle, isAfter);

    if (seen.has(item.text) || globalSeen.has(item.text)) {
      misses++;
      if (misses > 300 && !flushed) {
        globalSeen = new Set();
        flushed = true;
        misses = 0;
      }
      if (misses > 800) break;
      continue;
    }
    misses = 0;
    seen.add(item.text);
    globalSeen.add(item.text);
    results.push(item);
    styleIndex++;
  }
  saveSeen(globalSeen);
  return results;
}

function render() {
  list.innerHTML = "";
  const items = getBatch();
  items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card";
    
    const highlighted = item.text
      .replace(/PP Krit/g, m => `<b>${m}</b>`)
      .replace(/@?GUCCI|Gucci/g, m => `<b>${m}</b>`)
      .replace(/MFW\d*|Milan Fashion Week/gi, m => `<b>${m}</b>`);

    const styleClass = item.styleName === "Elegant" ? "style-formal" : "style-hype";

    card.innerHTML = `
      <div class="card-header">
        <span class="index">#${i + 1}</span>
        <div class="card-tags">
          <span class="tag ${styleClass}">${item.styleName}</span>
        </div>
      </div>
      <div class="text">${highlighted}</div>
      <div style="text-align: right; margin-top: 4px;"><span class="tip">Tap to copy</span></div>
    `;
    
    card.addEventListener("click", () => copyText(item.text, card));
    list.appendChild(card);
  });
}

async function copyText(text, card) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  card.classList.add("copied");
  card.querySelector(".tip").textContent = "Copied ✓";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
    card.classList.remove("copied");
    card.querySelector(".tip").textContent = "Tap to copy";
  }, 1500);
}

document.getElementById("refreshBtn").addEventListener("click", render);

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    if (currentMode === tab.dataset.mode) return;
    currentMode = tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    render();
  });
});

render();
</script>
</body>
</html>
